project:
  type: website
  render:
    - README.md
    - notebooks/**/*.ipynb
  preview:
    port: 4200
    browser: false
  resources:
    - notebooks/apps/img/**/*
    - notebooks/apps/nbx/img/**/*
    - notebooks/apps/cda/img/**/*

bibliography: assets/references.bib

execute:
  freeze: auto

format:
  html:
    lightbox: true
    html-math-method: katex
    highlight-annotations: true
    toc: true
    toc-location: right
    theme: united
    # highlight-style: dracula
    # theme:
    #   light: [cosmo, assets/theme.scss]
    #   dark:  [cosmo, assets/theme-dark.scss]
    css: assets/styles.css

website:
  title: "particle1331/ai-notebooks"
  repo-url: https://github.com/particle1331/ai-notebooks
  site-url: https://particle1331.github.io/ai-notebooks/
  back-to-top-navigation: true
  favicon: assets/robot.jpg
  page-navigation: true
  bread-crumbs: true
  reader-mode: true

  navbar:
    left:
      - text: "README"
        href: index.html
      - text: "Topics"
        menu:
          - text: "Deep Learning Foundations"
            href: notebooks/deep/index.html
          - text: "Language Models From Scratch"
            href: notebooks/llm/index.html
          - text: "Agentic Systems"
            href: notebooks/agents/index.html
          - text: "Application Development"
            href: notebooks/apps/index.html
          - text: "Special Topics & Tooling"
            href: notebooks/tooling/index.html
          - text: "AI Engineering Crash Course"
            href: notebooks/prep/index.html

    tools:
      - icon: github
        href: https://github.com/particle1331/ai-notebooks
        text: GitHub

