project:
  type: website
  render:
    - README.md
    - topics/**/*.ipynb
  preview:
    port: 4200
    browser: false
  resources:
    - topics/apps/img/**/*

bibliography: assets/references.bib

execute:
  freeze: auto

format:
  html:
    lightbox: true
    html-math-method: katex
    highlight-annotations: true
    toc: true
    toc-location: right
    theme: united
    # highlight-style: dracula
    # theme:
    #   light: [cosmo, assets/theme.scss]
    #   dark:  [cosmo, assets/theme-dark.scss]
    css: assets/styles.css

website:
  title: "particle1331/ai-notebooks"
  repo-url: https://github.com/particle1331/ai-notebooks
  site-url: https://particle1331.github.io/ai-notebooks/
  back-to-top-navigation: true
  favicon: assets/robot.jpg
  page-navigation: true
  bread-crumbs: true
  reader-mode: true

  navbar:
    left:
      - text: "README"
        href: index.html
      - text: "Topics"
        menu:
          - text: "Deep Learning"
            href: topics/deep/index.html
          - text: "Agentic Systems"
            href: topics/agents/index.html
          - text: "App Development"
            href: topics/apps/index.html
          - text: "Talks, Tools, & Topics"
            href: topics/tooling/index.html

    tools:
      - icon: github
        href: https://github.com/particle1331/ai-notebooks
        text: GitHub

  sidebar:
    - id: deep
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: topics/deep/index.ipynb
          contents: topics/deep/*.ipynb
        # - section: "CUDA Programming"
        # recsys
        # deep RL
 
    - id: tooling
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: topics/tooling/index.ipynb
          contents: topics/tooling/*.ipynb

    - id: agents
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: topics/agents/index.ipynb
          contents: topics/agents/*.ipynb

        - section: ""
          href: topics/agents/patterns/index.ipynb
          contents: topics/agents/patterns/*.ipynb

    - id: apps
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: topics/apps/index.ipynb
          contents: topics/apps/*.ipynb
