project:
  type: website
  render:
    - README.md
    - notebooks/**/*.ipynb
  preview:
    port: 4200
    browser: false
  resources:
    - notebooks/apps/img/**/*
    - notebooks/apps/nbx/img/**/*
    - notebooks/apps/cda/img/**/*

bibliography: assets/references.bib

execute:
  freeze: auto

format:
  html:
    lightbox: true
    html-math-method: katex
    highlight-annotations: true
    toc: true
    toc-location: right
    theme: united
    # highlight-style: dracula
    # theme:
    #   light: [cosmo, assets/theme.scss]
    #   dark:  [cosmo, assets/theme-dark.scss]
    css: assets/styles.css

website:
  title: "particle1331/ai-notebooks"
  repo-url: https://github.com/particle1331/ai-notebooks
  site-url: https://particle1331.github.io/ai-notebooks/
  back-to-top-navigation: true
  favicon: assets/robot.jpg
  page-navigation: true
  bread-crumbs: true
  reader-mode: true

  navbar:
    left:
      - text: "README"
        href: index.html
      - text: "Topics"
        menu:
          - text: "Deep Learning Foundations"
            href: notebooks/deep/index.html
          - text: "Language Models From Scratch"
            href: notebooks/llm/index.html
          - text: "Agentic Systems"
            href: notebooks/agents/index.html
          - text: "Application Development"
            href: notebooks/apps/index.html
          - text: "Special Topics & Tooling"
            href: notebooks/tooling/index.html
          - text: "AI Engineering Crash Course"
            href: notebooks/prep/index.html

    tools:
      - icon: github
        href: https://github.com/particle1331/ai-notebooks
        text: GitHub

  sidebar:
    - id: deep
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: notebooks/deep/index.ipynb
          contents: notebooks/deep/*.ipynb
        # - section: "CUDA Programming"
        # recsys
        # deep RL

    - id: llm
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: notebooks/llm/index.ipynb
          contents: notebooks/llm/*.ipynb
 
    - id: tooling
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: notebooks/tooling/index.ipynb
          contents: notebooks/tooling/*.ipynb

    - id: agents
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: notebooks/agents/index.ipynb
          contents: notebooks/agents/*.ipynb

        - section: ""
          href: notebooks/agents/patterns/index.ipynb
          contents: notebooks/agents/patterns/*.ipynb

    - id: apps
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: ""
          href: notebooks/apps/index.ipynb
          contents: notebooks/apps/*.ipynb

        - section: "NBX: Compute Platform"
          href: notebooks/apps/nbx/index.ipynb
          contents:
            - notebooks/apps/nbx/01-architecture.ipynb
            - notebooks/apps/nbx/02-registry.ipynb
            - notebooks/apps/nbx/03-packaging.ipynb
            - notebooks/apps/nbx/04-queue.ipynb
            - notebooks/apps/nbx/05-streaming.ipynb

        - section: "CDA: Coding Agent From Scratch"
          href: notebooks/apps/cda/index.ipynb
          contents: notebooks/apps/cda/*.ipynb

    - id: prep
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - section: "Crash Course"
          href: notebooks/prep/index.ipynb
          contents:
            - notebooks/prep/01-llm-api.ipynb
            - notebooks/prep/02-prompt-engg.ipynb
            - notebooks/prep/03-rag-concepts.ipynb
            - notebooks/prep/04-eval-concepts.ipynb
            - notebooks/prep/05-agents-foundations.ipynb
            - notebooks/prep/06-observability.ipynb
            - notebooks/prep/07-rag-pipeline.ipynb
            - notebooks/prep/08-agents-langgraph.ipynb
            - notebooks/prep/09-fine-tuning.ipynb
            - notebooks/prep/10-model-serving.ipynb
            - notebooks/prep/11-cost-optimization.ipynb
            - notebooks/prep/12-ai-infra.ipynb
            - notebooks/prep/13-capstone-compliance.ipynb

        - section: "Deep Dives"
          href: notebooks/prep/deep-dives/index.ipynb
          contents:
            - notebooks/prep/deep-dives/01-advanced-rag.ipynb
            - notebooks/prep/deep-dives/02-eval-pipelines.ipynb
            - notebooks/prep/deep-dives/03-agent-memory.ipynb
            - notebooks/prep/deep-dives/04-resilience.ipynb
            - notebooks/prep/deep-dives/05-mlops.ipynb
            - notebooks/prep/deep-dives/06-ai-security.ipynb
            - notebooks/prep/deep-dives/07-embeddings-advanced.ipynb
            - notebooks/prep/deep-dives/08-multimodal.ipynb
            - notebooks/prep/deep-dives/09-iac-containers.ipynb
